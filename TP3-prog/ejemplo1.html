<html>

    <body>
        <h1>Tipos de listas en html</h1>
        <big><ul><li><b>Lista desordenada:</b></li></ul></big>
        <ul>
            <li>CPU rapida</li>
            <li>Impresora a color de buen definicion</li>
            <li>Altavoces y camara de video</li>

        <ul>

        </ul>

           <li>CPU rapida</li>
           <li>Impresora a color de buena definicion</li>
           <li>Altavoces y camara de video</li>
        </ol>
    </body>
</html>
